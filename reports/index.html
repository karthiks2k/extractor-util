<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Employee Payslips</title>
		<style>
			* {
				box-sizing: border-box;
			}

			:root {
				color-scheme: light;
				font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
				color: #202b28;
				background: #f5f7f5;
			}

			body {
				min-width: 320px;
				min-height: 100vh;
				margin: 0;
			}

			.topbar {
				height: 4px;
				background: #16745c;
			}

			main {
				width: min(100% - 2rem, 1100px);
				margin: 0 auto;
				padding: 3rem 0;
			}

			.eyebrow {
				margin: 0 0 0.5rem;
				color: #557069;
				font-size: 0.75rem;
				font-weight: 700;
				letter-spacing: 0.08em;
				text-transform: uppercase;
			}

			h1 {
				margin: 0 0 2rem;
				font-size: 2rem;
				line-height: 1.15;
			}

			form {
				display: flex;
				gap: 0.75rem;
				max-width: 620px;
				margin-bottom: 2rem;
			}

			label {
				position: absolute;
				width: 1px;
				height: 1px;
				overflow: hidden;
				clip: rect(0, 0, 0, 0);
				white-space: nowrap;
				clip-path: inset(50%);
			}

			input {
				min-width: 0;
				flex: 1;
				padding: 0.75rem 0.9rem;
				border: 1px solid #c5d0cb;
				border-radius: 4px;
				background: #fff;
				color: inherit;
				font: inherit;
			}

			input:focus-visible,
			button:focus-visible,
			.document-link:focus-visible {
				outline: 3px solid #8cc9b2;
				outline-offset: 2px;
			}

			button {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: 0.5rem;
				padding: 0.75rem 1rem;
				border: 0;
				border-radius: 4px;
				background: #16745c;
				color: #fff;
				cursor: pointer;
				font: inherit;
				font-weight: 650;
			}

			button:hover {
				background: #105b48;
			}

			button svg {
				width: 1rem;
				height: 1rem;
				fill: none;
				stroke: currentColor;
				stroke-linecap: round;
				stroke-linejoin: round;
				stroke-width: 2;
			}

			.results[hidden] {
				display: none;
			}

			.results-heading {
				display: flex;
				align-items: baseline;
				justify-content: space-between;
				gap: 1rem;
				margin-bottom: 0.75rem;
			}

			h2 {
				margin: 0;
				font-size: 1.1rem;
			}

			#result-count {
				color: #62706c;
				font-size: 0.875rem;
			}

			.table-wrap {
				overflow-x: auto;
				border: 1px solid #d5ded9;
				border-radius: 4px;
				background: #fff;
			}

			table {
				width: 100%;
				border-collapse: collapse;
				text-align: left;
			}

			th,
			td {
				padding: 0.9rem 1rem;
				border-bottom: 1px solid #e5eae7;
				white-space: nowrap;
			}

			th {
				background: #edf2ef;
				color: #42534d;
				font-size: 0.75rem;
				font-weight: 700;
				letter-spacing: 0.04em;
				text-transform: uppercase;
			}

			tbody tr:last-child td {
				border-bottom: 0;
			}

			tbody tr:hover {
				background: #f7faf8;
			}

			.document-link {
				display: inline-flex;
				width: 2rem;
				height: 2rem;
				align-items: center;
				justify-content: center;
				border-radius: 4px;
				color: #16745c;
			}

			.payslip-actions {
				display: flex;
				align-items: center;
				gap: 0.25rem;
			}

			.document-link:hover {
				background: #e9f4ef;
			}

			.document-link svg {
				width: 1.25rem;
				height: 1.25rem;
				fill: none;
				stroke: currentColor;
				stroke-linecap: round;
				stroke-linejoin: round;
				stroke-width: 1.7;
			}

			#empty-state {
				margin: 0;
				padding: 1.5rem;
				color: #62706c;
			}

			@media (max-width: 520px) {
				main {
					padding: 2rem 0;
				}

				form {
					flex-direction: column;
				}

				button {
					min-height: 2.75rem;
				}
			}
		</style>
	</head>
	<body>
		<div class="topbar" aria-hidden="true"></div>
		<main>
			<p class="eyebrow">Payroll</p>
			<h1>Employee payslips</h1>

			<form id="search-form" role="search">
				<label for="search-input">Search payslips</label>
				<input id="search-input" name="query" type="search" placeholder="Enter an employee, year, or month" autocomplete="off" required>
				<button type="submit">
					<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
					Search
				</button>
			</form>

			<section id="results" class="results" aria-labelledby="results-title" hidden>
				<div class="results-heading">
					<h2 id="results-title">Payslip records</h2>
					<span id="result-count" aria-live="polite"></span>
				</div>
				<div class="table-wrap">
					<table>
						<thead>
							<tr>
								<th scope="col">Employee number</th>
								<th scope="col">Name</th>
								<th scope="col">Year</th>
								<th scope="col">Month</th>
								<th scope="col">Payslip</th>
							</tr>
						</thead>
						<tbody id="payslip-rows"></tbody>
					</table>
					<p id="empty-state" hidden>No payslips match that search.</p>
				</div>
			</section>
		</main>

		<script>
			const payslips = [
				{ employeeNumber: "EMP-1042", name: "Avery Chen", year: 2025, month: "January" },
				{ employeeNumber: "EMP-1078", name: "Jordan Patel", year: 2025, month: "February" },
				{ employeeNumber: "EMP-1126", name: "Morgan Rivera", year: 2025, month: "March" },
				{ employeeNumber: "EMP-1183", name: "Taylor Kim", year: 2024, month: "December" },
				{ employeeNumber: "EMP-1215", name: "Casey Okafor", year: 2025, month: "January" },
				{ employeeNumber: "EMP-1248", name: "Rowan Brooks", year: 2025, month: "April" },
				{ employeeNumber: "EMP-1304", name: "Samira Hassan", year: 2025, month: "May" },
				{ employeeNumber: "EMP-1339", name: "Emerson Diaz", year: 2024, month: "November" },
				{ employeeNumber: "EMP-1392", name: "Noor Williams", year: 2025, month: "June" },
				{ employeeNumber: "EMP-1427", name: "Jamie Nguyen", year: 2025, month: "July" },
				{ employeeNumber: "EMP-1481", name: "Riley Thompson", year: 2024, month: "October" },
				{ employeeNumber: "EMP-1506", name: "Alex Morgan", year: 2025, month: "August" },
				{ employeeNumber: "EMP-1563", name: "Drew Campbell", year: 2025, month: "September" },
				{ employeeNumber: "EMP-1608", name: "Quinn Parker", year: 2024, month: "September" },
				{ employeeNumber: "EMP-1642", name: "Sasha Ivanov", year: 2025, month: "October" }
			];

			const searchForm = document.querySelector("#search-form");
			const searchInput = document.querySelector("#search-input");
			const results = document.querySelector("#results");
			const rows = document.querySelector("#payslip-rows");
			const resultCount = document.querySelector("#result-count");
			const emptyState = document.querySelector("#empty-state");
			const activePdfUrls = new Set();

			function createPayslipPdfUrl(payslip) {
				const escapePdfText = (value) => String(value)
					.replace(/[^\x20-\x7E]/g, "?")
					.replace(/[\\()]/g, "\\$&");
				const lines = [
					"BT",
					"/F1 20 Tf",
					"50 740 Td",
					`(${escapePdfText("Sample Payslip")}) Tj`,
					"/F1 12 Tf",
					"0 -36 Td",
					`(${escapePdfText(`Employee number: ${payslip.employeeNumber}`)}) Tj`,
					"0 -24 Td",
					`(${escapePdfText(`Name: ${payslip.name}`)}) Tj`,
					"0 -24 Td",
					`(${escapePdfText(`Period: ${payslip.month} ${payslip.year}`)}) Tj`,
					"ET"
				].join("\n");
				const objects = [
					"<< /Type /Catalog /Pages 2 0 R >>",
					"<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
					"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 5 0 R >> >> /Contents 4 0 R >>",
					`<< /Length ${lines.length} >>\nstream\n${lines}\nendstream`,
					"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>"
				];

				let pdf = "%PDF-1.4\n";
				const offsets = [0];
				for (const [index, object] of objects.entries()) {
					offsets.push(pdf.length);
					pdf += `${index + 1} 0 obj\n${object}\nendobj\n`;
				}

				const crossReferenceOffset = pdf.length;
				pdf += `xref\n0 ${objects.length + 1}\n0000000000 65535 f \n`;
				for (const offset of offsets.slice(1)) {
					pdf += `${String(offset).padStart(10, "0")} 00000 n \n`;
				}
				pdf += `trailer\n<< /Size ${objects.length + 1} /Root 1 0 R >>\nstartxref\n${crossReferenceOffset}\n%%EOF`;

				return URL.createObjectURL(new Blob([pdf], { type: "application/pdf" }));
			}

			searchForm.addEventListener("submit", (event) => {
				event.preventDefault();
				const query = searchInput.value.trim().toLowerCase();
				if (!query) return;

				const matches = payslips.filter((payslip) =>
					[payslip.employeeNumber, payslip.name, payslip.year, payslip.month]
						.some((value) => String(value).toLowerCase().includes(query))
				);

				for (const pdfUrl of activePdfUrls) URL.revokeObjectURL(pdfUrl);
				activePdfUrls.clear();
				rows.replaceChildren();
				for (const payslip of matches) {
					const row = document.createElement("tr");
					for (const value of [payslip.employeeNumber, payslip.name, payslip.year, payslip.month]) {
						const cell = document.createElement("td");
						cell.textContent = value;
						row.append(cell);
					}

					const payslipCell = document.createElement("td");
					const actions = document.createElement("div");
					actions.className = "payslip-actions";
					const pdfUrl = createPayslipPdfUrl(payslip);
					activePdfUrls.add(pdfUrl);

					const viewLink = document.createElement("a");
					viewLink.className = "document-link";
					viewLink.href = pdfUrl;
					viewLink.target = "_blank";
					viewLink.rel = "noopener noreferrer";
					viewLink.setAttribute("aria-label", `View payslip for ${payslip.name}, ${payslip.month} ${payslip.year}`);
					viewLink.title = "View payslip";
					viewLink.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>';

					const downloadLink = document.createElement("a");
					downloadLink.className = "document-link";
					downloadLink.href = pdfUrl;
					downloadLink.download = `${payslip.employeeNumber}-${payslip.year}-${payslip.month}-payslip.pdf`;
					downloadLink.setAttribute("aria-label", `Download payslip for ${payslip.name}, ${payslip.month} ${payslip.year}`);
					downloadLink.title = "Download payslip";
					downloadLink.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="m7 10 5 5 5-5M12 15V3"></path></svg>';

					actions.append(viewLink, downloadLink);
					payslipCell.append(actions);
					row.append(payslipCell);
					rows.append(row);
				}

				results.hidden = false;
				emptyState.hidden = matches.length > 0;
				resultCount.textContent = `${matches.length} ${matches.length === 1 ? "record" : "records"}`;
			});
		</script>
	</body>
</html>
